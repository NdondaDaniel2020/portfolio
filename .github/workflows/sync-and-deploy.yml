name: Sync Data & Deploy ndonda.me

on:
  schedule:
    # Executa todos os dias às 03:00 UTC (04:00 em Luanda)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite disparar manualmente via botão no GitHub
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Sincronizar Dados (GitHub + Medium)
        run: npm run sync-data

      - name: Commit e Push dos Dados Atualizados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos dados detectada."
          else
            git commit -m "chore(data): auto-sync projects & articles [skip ci]"
            git push origin main
          fi

      - name: Build da Aplicação Vite
        run: npm run build

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: ndonda.me
